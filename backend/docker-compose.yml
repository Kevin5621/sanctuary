# Orkestrasi development lokal: `docker compose up -d`
# Menjalankan PostgreSQL + Redis + API (hot reload via air).
#
# Migrasi & seed TIDAK dijalankan otomatis oleh compose ini — jalankan
# eksplisit setelah db sehat (lihat Makefile: `make migrate`, `make seed`),
# selaras dengan aturan seeding di api-configuration-standards.md.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sanctuary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sanctuary}
      POSTGRES_DB: ${POSTGRES_DB:-sanctuary}
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - sanctuary_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sanctuary} -d $${POSTGRES_DB:-sanctuary}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${HTTP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_PORT: ${HTTP_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      # Nama host mengacu ke service compose, bukan localhost.
      DB_DSN: postgres://${POSTGRES_USER:-sanctuary}:${POSTGRES_PASSWORD:-sanctuary}@db:5432/${POSTGRES_DB:-sanctuary}?sslmode=disable
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}
      DB_AUTO_SEED: ${DB_AUTO_SEED:-true}
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-32-characters-min}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_ORIGINS: ${ALLOW_ORIGINS:-http://localhost:3000,http://localhost:8081}
      RATE_LIMIT_FAIL_CLOSED: ${RATE_LIMIT_FAIL_CLOSED:-false}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-Sanctuary123!}
    volumes:
      - .:/app
      - sanctuary_go_mod_cache:/go/pkg/mod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  sanctuary_db_data:
  sanctuary_go_mod_cache:
