# Konfigurasi live-reload untuk development (dipakai lokal via `make dev`
# maupun di dalam container lewat Dockerfile.dev).
# Tool: https://github.com/air-verse/air
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  full_bin = "./tmp/api"
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp", "build", "migrations", "test", "apps/api/seeders"]
  exclude_regex = ["_test\\.go"]
  delay = 300
  send_interrupt = true
  kill_delay = "3s"
  stop_on_error = true

[log]
  time = true

[color]
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = false
