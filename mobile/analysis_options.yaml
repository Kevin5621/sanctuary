include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Konten privat tidak boleh bocor lewat log.
    avoid_print: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_const_constructors
    - prefer_final_locals
    - unawaited_futures
    - use_super_parameters
