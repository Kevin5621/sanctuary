name: sanctuary
description: Sanctuary — aplikasi kesehatan mental mahasiswa (Full Online, REST API).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Network (Full Online — tidak ada local DB)
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Penyimpanan token (OS keychain / EncryptedSharedPreferences)
  flutter_secure_storage: ^9.2.2

  # Navigasi berbasis peran
  go_router: ^14.6.1

  # Utilitas
  intl: ^0.19.0
  fl_chart: ^0.69.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
